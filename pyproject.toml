[project]
name = "context-repo"
version = "0.1.0"
description = "Shared, capacity-bounded semantic memory that multiple AI sessions can read from and write to."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextrepo*"]
